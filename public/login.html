<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in · Dev Setup Assistant</title>
    <link rel="stylesheet" href="/public/theme.css">
    <style>
        :root { --ink:#172033; --muted:#68748a; --line:#dde7e3; --brand:#0f766e; --brand-dark:#115e59; --surface:#fff; --canvas:#f4f7f5; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; font-family:Inter,"Segoe UI",system-ui,sans-serif; color:var(--ink); background:var(--canvas); }
        .shell { min-height:100vh; display:grid; grid-template-columns:minmax(320px,42%) 1fr; }
        .brand-panel { position:relative; display:flex; flex-direction:column; justify-content:space-between; padding:48px clamp(32px,6vw,72px); overflow:hidden; color:white; background:linear-gradient(145deg,#0f766e 0%,#14b8a6 58%,#5eead4 100%); }
        .brand-panel::before,.brand-panel::after { content:""; position:absolute; border-radius:50%; background:rgba(255,255,255,.09); }
        .brand-panel::before { width:420px;height:420px;right:-220px;top:-180px; }
        .brand-panel::after { width:280px;height:280px;left:-140px;bottom:-150px; }
        .brand { position:relative;z-index:1; display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px; }
        .logo { width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1px solid rgba(255,255,255,.28); }
        .pitch { position:relative;z-index:1;max-width:520px;margin:auto 0; }
        .pitch h1 { margin:0 0 18px;font-size:clamp(42px,5vw,68px);line-height:1.02;letter-spacing:-3px; }
        .pitch p { margin:0;font-size:18px;line-height:1.7;color:rgba(255,255,255,.82);max-width:470px; }
        .features { position:relative;z-index:1;display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,.8); }
        .features span { display:flex;align-items:center;gap:7px; }
        .features i { width:7px;height:7px;border-radius:50%;background:#baffd6;box-shadow:0 0 0 4px rgba(186,255,214,.12); }
        .auth-panel { display:grid;place-items:center;padding:40px 24px;background:linear-gradient(180deg,#fafcfb,#f4f7f5); }
        .auth-card { width:min(420px,100%); }
        .auth-card h2 { margin:0 0 8px;font-size:34px;letter-spacing:-1.2px; }
        .subtitle { margin:0 0 30px;color:var(--muted); }
        label { display:block;margin:18px 0 8px;font-size:14px;font-weight:700; }
        .field { position:relative; }
        input { width:100%;height:52px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-size:15px;outline:none;transition:.2s; }
        input:focus { border-color:#14b8a6;box-shadow:0 0 0 4px rgba(20,184,166,.1); }
        button { width:100%;height:52px;margin-top:24px;border:0;border-radius:12px;background:var(--brand);color:white;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(20,184,166,.22);transition:.2s; }
        button:hover { background:var(--brand-dark);transform:translateY(-1px); }
        button:disabled { opacity:.7;cursor:not-allowed;transform:none; }
        .message { min-height:22px;margin-top:14px;text-align:center;font-size:14px;color:#c22d3a; }
        .message.success { color:#16805a; }
        .signup-link { margin-top:22px;text-align:center;color:var(--muted);font-size:14px; }
        .signup-link a { color:var(--brand);font-weight:800;text-decoration:none; }
        @media (max-width:760px) { .shell { grid-template-columns:1fr; } .brand-panel { min-height:220px;padding:28px 24px; } .pitch { margin:38px 0 20px; } .pitch h1 { font-size:38px;letter-spacing:-2px;margin-bottom:10px; } .pitch p { font-size:15px; } .features { display:none; } .auth-panel { min-height:calc(100vh - 220px);padding:36px 20px;align-items:start; } }
    </style>
</head>
<body>
    <main class="shell">
        <section class="brand-panel">
            <div class="brand"><span class="logo">⌘</span><span>Dev Setup Assistant</span></div>
            <div class="pitch"><h1>Build with confidence.</h1><p>Get clear setup steps, installation guidance, and visual answers from one helpful workspace.</p></div>
            <div class="features"><span><i></i>Guided setup</span><span><i></i>Image analysis</span><span><i></i>Developer help</span></div>
        </section>
        <section class="auth-panel">
            <div class="auth-card">
                <h2>Welcome back</h2><p class="subtitle">Log in to continue to your assistant.</p>
                <form id="loginForm">
                    <label for="email">Email address</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                    <label for="password">Password</label><input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button id="submitButton" type="submit">Log in</button>
                </form>
                <div id="message" class="message" role="status" aria-live="polite"></div>
                <p class="signup-link">New here? <a href="/signup">Create an account</a></p>
            </div>
        </section>
    </main>
    <script>
        const form=document.getElementById('loginForm'),button=document.getElementById('submitButton'),message=document.getElementById('message');
        form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;button.textContent='Logging in…';message.className='message';message.textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const data=await response.json();if(response.ok){message.className='message success';message.textContent='Login successful — opening your workspace…';setTimeout(()=>window.location.href='/chat/login',700);}else{message.textContent=data.detail||'Invalid username or password.';}}catch(err){message.textContent='Network error. Please try again.';}finally{if(!message.classList.contains('success')){button.disabled=false;button.textContent='Log in';}}});
    </script>
    <script src="/public/theme.js"></script>
</body>
</html>
